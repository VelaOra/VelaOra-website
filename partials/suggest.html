<div class="vo-suggest" id="suggest">
  <div>
    <span class="vo-eyebrow">Your turn</span>
    <h3>What should Sarah and the VelaOra team review next?</h3>
    <p>A product, a class, a supplement, a symptom. One word is enough and we'll look into it.</p>
  </div>
  <div>
    <form class="vo-form" data-vo-lead="suggest" data-vo-after="stay" data-vo-ok="Thank you! It's on the list. Keep an eye on 'Coming up next'.">
      <input type="hidden" name="_subject" value="VelaOra: review suggestion">
      <input type="text" name="suggestion" maxlength="80" placeholder="e.g. creatine, pilates, Oura" aria-label="What should Sarah and the VelaOra team review next?" required>
      <button type="submit" class="vo-btn vo-btn-gold">Suggest</button>
    </form>
    <p class="vo-msg" role="status"></p>
    <p class="vo-fine">No email needed.</p>
  </div>
</div>

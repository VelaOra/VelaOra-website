<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090807" />
  <title>Restora · by Velaora</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <style>
    html, body, #root { margin: 0; padding: 0; min-height: 100%; background: #090807; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ─── Design Tokens ────────────────────────────────────────────────────────
    const C = {
      bg:            "#0F0D0B",
      bgDeep:        "#090807",
      bgCard:        "#1A1714",
      glass:         "rgba(255,255,255,0.038)",
      glassBright:   "rgba(255,255,255,0.068)",
      glassBorder:   "rgba(255,255,255,0.075)",
      glassBorderHi: "rgba(255,255,255,0.18)",
      sage:          "#8DD4B6",
      sageDark:      "#68B098",
      sageMid:       "#4A8A6E",
      sageGlow:      "rgba(141,212,182,0.30)",
      sageDeep:      "rgba(141,212,182,0.07)",
      rose:          "#EBB2A8",
      roseGlow:      "rgba(235,178,168,0.30)",
      roseDeep:      "rgba(235,178,168,0.07)",
      gold:          "#D8B76C",
      goldGlow:      "rgba(216,183,108,0.30)",
      goldDeep:      "rgba(216,183,108,0.07)",
      charcoal:      "#EDE8E3",
      mid:           "#9A8F87",
      muted:         "#5E5550",
      border:        "rgba(255,255,255,0.068)",
      borderActive:  "rgba(141,212,182,0.38)",
      white:         "#FFFFFF",
    };

    const PASSWORD = "Velaora2026";

    // ─── Global CSS ───────────────────────────────────────────────────────────
    const GLOBAL_CSS = `
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap');
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; }
      body { background: ${C.bg}; }

      @keyframes fadeUp   { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }

      @keyframes orbIdle  {
        0%,100% { transform:scale(0.90); filter:brightness(0.92) saturate(0.92); }
        50%     { transform:scale(1.14); filter:brightness(1.16) saturate(1.10); }
      }
      @keyframes breatheIn  { from { transform:scale(1);    filter:brightness(1)    saturate(1);    }
                               to   { transform:scale(1.40); filter:brightness(1.22) saturate(1.18); } }
      @keyframes breatheOut { from { transform:scale(1.40); filter:brightness(1.22) saturate(1.18); }
                               to   { transform:scale(1);    filter:brightness(0.88) saturate(0.90); } }
      @keyframes holdPulse  { 0%,100%{transform:scale(1.40) rotate(0deg);} 50%{transform:scale(1.43) rotate(1deg);} }

      @keyframes glowIdle  { 0%,100%{opacity:0.55;transform:scale(1);}   50%{opacity:0.9;transform:scale(1.18);} }
      @keyframes glowIn    { from{opacity:0.55;transform:scale(1);}  to{opacity:1;transform:scale(1.55);} }
      @keyframes glowOut   { from{opacity:1;transform:scale(1.55);}  to{opacity:0.45;transform:scale(0.9);} }
      @keyframes glowHold  { 0%,100%{opacity:0.9;transform:scale(1.55);} 50%{opacity:1;transform:scale(1.65);} }

      @keyframes shimmer { 0%{opacity:0;transform:rotate(0deg) translateX(36%) rotate(0deg);}
        20%{opacity:0.55;} 80%{opacity:0.55;}
        100%{opacity:0;transform:rotate(360deg) translateX(36%) rotate(-360deg);} }
      @keyframes float     { 0%,100%{transform:translateY(0);}  50%{transform:translateY(-7px);} }
      @keyframes dotBounce { 0%,100%{opacity:0.3;transform:translateY(0);} 50%{opacity:1;transform:translateY(-5px);} }
      @keyframes slideIn   { from{opacity:0;transform:translateX(14px);} to{opacity:1;transform:translateX(0);} }
      @keyframes tabEnter  { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

      @keyframes aurora1 { 0%,100%{transform:translate(0,0) scale(1);opacity:0.7;} 33%{transform:translate(6%,10%) scale(1.12);opacity:1;} 66%{transform:translate(-4%,6%) scale(0.94);opacity:0.8;} }
      @keyframes aurora2 { 0%,100%{transform:translate(0,0) scale(1);opacity:0.6;} 50%{transform:translate(-9%,-7%) scale(1.18);opacity:0.9;} }
      @keyframes aurora3 { 0%,100%{transform:translate(0,0) scale(1);opacity:0.5;} 40%{transform:translate(7%,-9%) scale(1.1);opacity:0.85;} 80%{transform:translate(-5%,4%) scale(0.92);opacity:0.6;} }
      @keyframes particleDrift { 0%{transform:translateY(0) translateX(0);opacity:0;} 20%{opacity:1;} 80%{opacity:0.6;} 100%{transform:translateY(-40px) translateX(12px);opacity:0;} }

      input, button { font-family: inherit; }
      input::placeholder { color: ${C.muted}; }
      ::-webkit-scrollbar { width: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.10); border-radius: 3px; }
      button:focus-visible { outline: 2px solid ${C.sage}; outline-offset: 3px; }
      input:focus { outline: none; }

      .glass-card {
        background: ${C.glass};
        border: 1px solid ${C.glassBorder};
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .hover-lift {
        transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
      }
      .hover-lift:hover {
        transform: translateY(-2px);
        border-color: ${C.glassBorderHi} !important;
        box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      }
    `;

    // ─── SVG Filters ──────────────────────────────────────────────────────────
    function OrbFilters() {
      return (
        <svg style={{ position: "absolute", width: 0, height: 0, overflow: "hidden" }}>
          <defs>
            <filter id="orb-morph" x="-55%" y="-55%" width="210%" height="210%">
              <feTurbulence type="fractalNoise" baseFrequency="0.016 0.013" numOctaves="4" seed="7" result="noise">
                <animate attributeName="baseFrequency" values="0.013 0.016;0.019 0.012;0.014 0.018;0.013 0.016" dur="14s" repeatCount="indefinite" />
                <animate attributeName="seed" values="7;19;7" dur="22s" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="16" xChannelSelector="R" yChannelSelector="G" result="displaced" />
              <feComposite in="displaced" in2="SourceGraphic" operator="in" />
            </filter>
            <filter id="orb-morph-lg" x="-55%" y="-55%" width="210%" height="210%">
              <feTurbulence type="fractalNoise" baseFrequency="0.013 0.010" numOctaves="4" seed="12" result="noise">
                <animate attributeName="baseFrequency" values="0.010 0.013;0.016 0.009;0.011 0.015;0.010 0.013" dur="12s" repeatCount="indefinite" />
                <animate attributeName="seed" values="12;28;12" dur="18s" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G" result="displaced" />
              <feComposite in="displaced" in2="SourceGraphic" operator="in" />
            </filter>
          </defs>
        </svg>
      );
    }

    // ─── Breathing Orb ────────────────────────────────────────────────────────
    function BreathOrb({ phase = "idle", size = 100 }) {
      const isLg = size >= 110;
      const filterId = isLg ? "orb-morph-lg" : "orb-morph";
      const phaseMap = {
        idle:   { core: `radial-gradient(circle at 33% 28%, rgba(200,245,225,0.55), ${C.sage} 42%, ${C.sageMid} 85%)`, glow: C.sageGlow, glowAnim: "glowIdle 5s ease-in-out infinite",  bodyAnim: "orbIdle 6s ease-in-out infinite"    },
        inhale: { core: `radial-gradient(circle at 33% 28%, rgba(220,255,240,0.65), ${C.sage} 38%, ${C.sageDark} 80%)`, glow: C.sageGlow, glowAnim: "glowIn 4s ease-in-out forwards",   bodyAnim: "breatheIn 4s ease-in-out forwards"  },
        hold:   { core: `radial-gradient(circle at 33% 28%, rgba(255,240,200,0.55), ${C.gold} 40%, #A8823A 82%)`,       glow: C.goldGlow, glowAnim: "glowHold 2s ease-in-out infinite", bodyAnim: "holdPulse 2s ease-in-out infinite"   },
        exhale: { core: `radial-gradient(circle at 33% 28%, rgba(255,220,215,0.45), ${C.rose} 40%, #C07870 82%)`,       glow: C.roseGlow, glowAnim: "glowOut 4s ease-in-out forwards",  bodyAnim: "breatheOut 4s ease-in-out forwards" },
      };
      const p = phaseMap[phase] || phaseMap.idle;
      const orbSize = Math.round(size * 0.70);

      return (
        <div style={{ width: size, height: size, position: "relative", display: "flex", alignItems: "center", justifyContent: "center", animation: "float 7s ease-in-out infinite" }}>
          <div style={{ position:"absolute", width:"185%", height:"185%", borderRadius:"50%", background:`radial-gradient(circle, ${p.glow} 0%, transparent 68%)`, animation:p.glowAnim, filter:`blur(${size*0.18}px)`, pointerEvents:"none", transition:"background 1.8s ease" }} />
          <div style={{ position:"absolute", width:"130%", height:"130%", borderRadius:"50%", background:`radial-gradient(circle, ${p.glow.replace("0.30","0.18")} 0%, transparent 60%)`, filter:`blur(${size*0.09}px)`, pointerEvents:"none", transition:"background 1.8s ease" }} />
          <div style={{ position:"absolute", width:orbSize*0.28, height:orbSize*0.28, borderRadius:"50%", background:"rgba(255,255,255,0.22)", filter:`blur(${size*0.04}px)`, animation:"shimmer 8s ease-in-out infinite", pointerEvents:"none" }} />
          <div style={{ width:orbSize, height:orbSize, borderRadius:"50%", background:p.core, boxShadow:[`0 0 ${size*0.28}px ${p.glow}`,`0 0 ${size*0.12}px ${p.glow.replace("0.30","0.55")}`,`inset 0 1px 1px rgba(255,255,255,0.32)`,`inset 0 -2px 4px rgba(0,0,0,0.22)`].join(", "), animation:p.bodyAnim, filter:`url(#${filterId})`, position:"relative", transition:"background 1.8s ease", willChange:"transform, filter" }}>
            <div style={{ position:"absolute", top:"13%", left:"20%", width:"30%", height:"21%", borderRadius:"50%", background:"rgba(255,255,255,0.50)", filter:"blur(3.5px)", transform:"rotate(-22deg)", pointerEvents:"none" }} />
            <div style={{ position:"absolute", bottom:"20%", right:"17%", width:"13%", height:"9%", borderRadius:"50%", background:"rgba(255,255,255,0.18)", filter:"blur(2px)", pointerEvents:"none" }} />
            <div style={{ position:"absolute", bottom:"8%", left:"20%", right:"20%", height:"6%", borderRadius:"50%", background:"rgba(255,255,255,0.10)", filter:"blur(3px)", pointerEvents:"none" }} />
          </div>
        </div>
      );
    }

    function Card({ children, style = {}, className = "" }) {
      return <div className={`glass-card ${className}`} style={{ borderRadius:22, padding:24, ...style }}>{children}</div>;
    }
    function Label({ children, color = C.muted, gradient = null }) {
      const style = gradient
        ? { background:gradient, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", fontSize:10, fontWeight:600, letterSpacing:2.2, textTransform:"uppercase", marginBottom:14 }
        : { color, fontSize:10, fontWeight:600, letterSpacing:2.2, textTransform:"uppercase", marginBottom:14 };
      return <p style={style}>{children}</p>;
    }

    // ─── Password Gate ────────────────────────────────────────────────────────
    const PARTICLES = [
      { top:"12%", left:"8%",  color:C.sage, size:2.5, dur:9,  delay:0   },
      { top:"22%", left:"85%", color:C.rose, size:2,   dur:12, delay:2   },
      { top:"68%", left:"12%", color:C.gold, size:1.5, dur:10, delay:4   },
      { top:"78%", left:"78%", color:C.sage, size:2,   dur:14, delay:1   },
      { top:"45%", left:"92%", color:C.rose, size:1.5, dur:11, delay:3   },
      { top:"88%", left:"40%", color:C.gold, size:2,   dur:13, delay:5   },
      { top:"35%", left:"5%",  color:C.sage, size:1.5, dur:8,  delay:6   },
      { top:"55%", left:"88%", color:C.rose, size:2.5, dur:15, delay:2.5 },
    ];

    function PasswordGate({ onUnlock }) {
      const [val, setVal] = useState("");
      const [error, setError] = useState(false);
      const [show, setShow] = useState(false);
      const [focused, setFocused] = useState(false);
      const attempt = () => {
        if (val === PASSWORD) { onUnlock(); }
        else { setError(true); setTimeout(() => setError(false), 2200); setVal(""); }
      };
      return (
        <div style={{ minHeight:"100vh", background:C.bgDeep, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:28, fontFamily:"Inter, sans-serif", position:"relative", overflow:"hidden" }}>
          <style>{GLOBAL_CSS}</style>
          <OrbFilters />
          <div style={{ position:"absolute", inset:0, pointerEvents:"none", overflow:"hidden" }}>
            <div style={{ position:"absolute", width:"75%", height:"55%", top:"-15%", left:"12%", background:`radial-gradient(ellipse, rgba(141,212,182,0.12) 0%, transparent 68%)`, filter:"blur(48px)", animation:"aurora1 14s ease-in-out infinite" }} />
            <div style={{ position:"absolute", width:"55%", height:"45%", bottom:"5%", right:"0%", background:`radial-gradient(ellipse, rgba(235,178,168,0.09) 0%, transparent 68%)`, filter:"blur(55px)", animation:"aurora2 18s ease-in-out infinite" }} />
            <div style={{ position:"absolute", width:"45%", height:"35%", bottom:"15%", left:"5%", background:`radial-gradient(ellipse, rgba(216,183,108,0.08) 0%, transparent 65%)`, filter:"blur(50px)", animation:"aurora3 22s ease-in-out infinite" }} />
            <div style={{ position:"absolute", top:0, left:0, right:0, height:"40%", background:"radial-gradient(ellipse 60% 100% at 50% 0%, rgba(141,212,182,0.06) 0%, transparent 100%)" }} />
          </div>
          {PARTICLES.map((p, i) => (
            <div key={i} style={{ position:"absolute", top:p.top, left:p.left, width:p.size, height:p.size, borderRadius:"50%", background:p.color, boxShadow:`0 0 6px ${p.color}`, animation:`particleDrift ${p.dur}s ease-in-out ${p.delay}s infinite`, pointerEvents:"none" }} />
          ))}
          {[[18,14],[32,76],[55,8],[70,88],[82,34],[91,62],[12,51],[44,92],[63,23],[77,5],[8,82],[50,44],[26,67],[88,18],[39,55]].map(([t,l], i) => (
            <div key={`s${i}`} style={{ position:"absolute", top:`${t}%`, left:`${l}%`, width:1, height:1, borderRadius:"50%", background:"rgba(255,255,255,0.35)", pointerEvents:"none", animation:`glowIdle ${6+(i%4)}s ease-in-out ${i*0.4}s infinite` }} />
          ))}
          <div style={{ position:"relative", zIndex:1, animation:"fadeUp 0.8s ease", display:"flex", flexDirection:"column", alignItems:"center", width:"100%", maxWidth:360 }}>
            <div style={{ marginBottom:16 }}><BreathOrb phase="idle" size={260} /></div>
            <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:48, fontWeight:300, letterSpacing:-1, marginBottom:4, textAlign:"center", lineHeight:1, background:`linear-gradient(135deg, ${C.charcoal} 0%, ${C.gold} 50%, ${C.charcoal} 100%)`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>Restora</p>
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
              <div style={{ width:28, height:1, background:`linear-gradient(90deg, transparent, ${C.gold})` }} />
              <p style={{ background:`linear-gradient(90deg, ${C.gold}, ${C.rose})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", fontSize:10, letterSpacing:3.5, textTransform:"uppercase" }}>by Velaora</p>
              <div style={{ width:28, height:1, background:`linear-gradient(90deg, ${C.rose}, transparent)` }} />
            </div>
            <p style={{ color:C.muted, fontSize:13, marginBottom:52, textAlign:"center", maxWidth:260, lineHeight:1.85 }}>Evidence-based sleep therapy rooted in CBT-I, for women who deserve better rest.</p>
            <div style={{ width:"100%", background:C.glass, border:`1px solid ${C.glassBorder}`, borderRadius:22, padding:"28px 24px", backdropFilter:"blur(24px)", WebkitBackdropFilter:"blur(24px)" }}>
              <div style={{ position:"relative", marginBottom:12 }}>
                <input type={show?"text":"password"} value={val} onChange={e=>setVal(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)} placeholder="Enter access code"
                  style={{ width:"100%", padding:"15px 50px 15px 20px", background:"rgba(255,255,255,0.04)", border:`1.5px solid ${error?C.rose+"90":focused?C.sage+"70":C.glassBorder}`, borderRadius:14, color:C.charcoal, fontSize:15, transition:"border-color 0.25s ease" }} />
                <button onClick={()=>setShow(!show)} style={{ position:"absolute", right:16, top:"50%", transform:"translateY(-50%)", background:"none", border:"none", color:C.muted, cursor:"pointer", fontSize:12, padding:4 }}>{show?"Hide":"Show"}</button>
              </div>
              {error && <p style={{ color:C.rose, fontSize:13, marginBottom:10, textAlign:"center", animation:"fadeIn 0.3s ease" }}>Incorrect code — please try again</p>}
              <button onClick={attempt} style={{ width:"100%", padding:"15px", background:`linear-gradient(140deg, ${C.gold}, #C49A2A, ${C.rose})`, border:"none", borderRadius:14, color:C.bgDeep, fontSize:15, fontWeight:600, cursor:"pointer", letterSpacing:0.5, boxShadow:`0 6px 32px rgba(216,183,108,0.45)`, transition:"transform 0.18s ease, box-shadow 0.18s ease" }}
                onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 12px 40px rgba(216,183,108,0.60)`;}}
                onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow=`0 6px 32px rgba(216,183,108,0.45)`;}}>Enter</button>
            </div>
            <p style={{ color:C.muted, fontSize:11, marginTop:32, textAlign:"center", lineHeight:1.7, opacity:0.7 }}>Access provided by Velaora · a women's health & wellness platform</p>
          </div>
        </div>
      );
    }

    // ─── Tabs ─────────────────────────────────────────────────────────────────
    const TABS = [
      { id:"about",    label:"About",   icon:"✦" },
      { id:"journey",  label:"Journey", icon:"⬡" },
      { id:"diagnose", label:"Assess",  icon:"◎" },
      { id:"cbti",     label:"CBT-I",   icon:"◈" },
      { id:"meditate", label:"Breathe", icon:"○" },
      { id:"sounds",   label:"Sounds",  icon:"♪" },
      { id:"coach",    label:"Coach",   icon:"◇" },
    ];

    // ─── Lotus SVG ───────────────────────────────────────────────────────────
    function LotusIcon({ size = 60 }) {
      const s = size;
      return (
        <svg width={s} height={s} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="lotusPetal1" cx="50%" cy="80%" r="70%">
              <stop offset="0%" stopColor="#EBB2A8" stopOpacity="0.9"/>
              <stop offset="100%" stopColor="#D8B76C" stopOpacity="0.7"/>
            </radialGradient>
            <radialGradient id="lotusPetal2" cx="50%" cy="80%" r="70%">
              <stop offset="0%" stopColor="#D8B76C" stopOpacity="0.85"/>
              <stop offset="100%" stopColor="#EBB2A8" stopOpacity="0.6"/>
            </radialGradient>
            <radialGradient id="lotusCenter" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#EDE8E3" stopOpacity="1"/>
              <stop offset="100%" stopColor="#D8B76C" stopOpacity="0.9"/>
            </radialGradient>
          </defs>
          {/* Back petals */}
          <ellipse cx="30" cy="52" rx="13" ry="26" fill="url(#lotusPetal2)" transform="rotate(-35 30 52)" opacity="0.7"/>
          <ellipse cx="70" cy="52" rx="13" ry="26" fill="url(#lotusPetal2)" transform="rotate(35 70 52)" opacity="0.7"/>
          <ellipse cx="50" cy="30" rx="10" ry="22" fill="url(#lotusPetal1)" opacity="0.65"/>
          {/* Mid petals */}
          <ellipse cx="22" cy="60" rx="12" ry="24" fill="url(#lotusPetal1)" transform="rotate(-55 22 60)" opacity="0.85"/>
          <ellipse cx="78" cy="60" rx="12" ry="24" fill="url(#lotusPetal1)" transform="rotate(55 78 60)" opacity="0.85"/>
          <ellipse cx="37" cy="38" rx="11" ry="23" fill="url(#lotusPetal2)" transform="rotate(-18 37 38)" opacity="0.9"/>
          <ellipse cx="63" cy="38" rx="11" ry="23" fill="url(#lotusPetal2)" transform="rotate(18 63 38)" opacity="0.9"/>
          {/* Front center petal */}
          <ellipse cx="50" cy="58" rx="13" ry="26" fill="url(#lotusPetal1)" opacity="0.95"/>
          {/* Center */}
          <circle cx="50" cy="68" r="8" fill="url(#lotusCenter)" opacity="0.95"/>
          <circle cx="50" cy="68" r="4" fill="#D8B76C" opacity="0.8"/>
          {/* Stamens */}
          <circle cx="44" cy="62" r="1.5" fill="#EDE8E3" opacity="0.9"/>
          <circle cx="50" cy="60" r="1.5" fill="#EDE8E3" opacity="0.9"/>
          <circle cx="56" cy="62" r="1.5" fill="#EDE8E3" opacity="0.9"/>
        </svg>
      );
    }

    // ─── About Tab ────────────────────────────────────────────────────────────
    function AboutTab({ setTab }) {
      return (
        <div style={{ animation:"fadeUp 0.5s ease" }}>
          <Card style={{ marginBottom:14, textAlign:"center", padding:"40px 24px" }}>
            <BreathOrb phase="idle" size={150} />
            <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:34, fontWeight:300, background:`linear-gradient(135deg, ${C.charcoal}, ${C.gold})`, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", marginTop:24, marginBottom:8, letterSpacing:-0.3 }}>Sleep Differently.</p>
            <p style={{ color:C.mid, fontSize:14, lineHeight:1.8, maxWidth:290, margin:"0 auto" }}>Restora brings the gold-standard CBT-I sleep therapy programme to you — clinically grounded, compassionately designed for women.</p>
          </Card>

          <Card style={{ marginBottom:14 }}>
            <Label color={C.gold}>Your Guide</Label>
            <div style={{ display:"flex", gap:18, alignItems:"flex-start" }}>

      const start = (p) => {
        stopBreathing(); setPat(p); setCycles(0);
        const phases = [{ n:"inhale", d:p.i }, ...(p.h?[{ n:"hold", d:p.h }]:[]), { n:"exhale", d:p.e }];
        let pi = 0;
        const next = () => {
          if (pi>=phases.length) { pi=0; setCycles(c=>c+1); }
          const { n, d } = phases[pi++];
          setPhase(n); setCount(d);
          let rem=d;
          const tick = () => { rem--; setCount(rem); timerRef.current=rem>0?setTimeout(tick,1000):setTimeout(next,300); };
          timerRef.current=setTimeout(tick,1000);
        };
        next();
      };

      const stopAudio = () => {
        if (audioRef.current) { audioRef.current.pause(); audioRef.current.currentTime=0; audioRef.current=null; }
        setPlaying(false); setPaused(false);
      };

      const toggleAudio = (voice) => {
        if (activeVoice?.id===voice.id) {
          if (playing && !paused) { audioRef.current?.pause(); setPaused(true); return; }
          if (paused) { audioRef.current?.play(); setPaused(false); return; }
        }
        stopAudio();
        setActiveVoice(voice);
        const audio = new Audio(voice.file);
        audioRef.current = audio;
        audio.playbackRate = playbackRate;
        audio.onended = () => { setPlaying(false); setPaused(false); };
        audio.onerror = () => { setPlaying(false); setPaused(false); };
        audio.play();
        setPlaying(true); setPaused(false);
      };

      useEffect(()=>()=>{ clearTimeout(timerRef.current); stopAudio(); },[]);

      const phaseColour = { inhale:C.sage, hold:C.gold, exhale:C.rose, ready:C.muted };
      const phaseLabel  = { inhale:"Breathe In", hold:"Hold", exhale:"Breathe Out", ready:"" };

      return (
        <div style={{ animation:"fadeUp 0.4s ease" }}>
          <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:30, fontWeight:300, color:C.charcoal, marginBottom:8, letterSpacing:-0.3 }}>Breathe & Rest</p>
          <p style={{ color:C.mid, fontSize:13, lineHeight:1.8, marginBottom:24 }}>Slow your nervous system before sleep with guided breathwork.</p>

          <Card style={{ marginBottom:18, textAlign:"center", padding:"36px 24px" }}>
            <BreathOrb phase={phase==="ready"?"idle":phase} size={160} />
            {phase!=="ready" ? (
              <div style={{ marginTop:24 }}>
                <p style={{ color:phaseColour[phase], fontFamily:"Cormorant Garamond, serif", fontSize:28, fontWeight:300, marginBottom:4, transition:"color 0.6s ease" }}>{phaseLabel[phase]}</p>
                <p style={{ color:C.charcoal, fontSize:52, fontWeight:200, letterSpacing:-3, lineHeight:1 }}>{count}</p>

                <button onClick={stopBreathing} style={{ marginTop:18, background:"none", border:`1px solid ${C.glassBorder}`, color:C.muted, borderRadius:12, padding:"9px 22px", cursor:"pointer", fontSize:13 }}>Stop</button>
              </div>

              <p style={{ color:C.muted, fontSize:13, marginTop:18 }}>Choose a pattern below to begin</p>
            )}
          </Card>

          <div style={{ display:"flex", flexDirection:"column", gap:10, marginBottom:28 }}>
            {PATTERNS.map(p => (
              <button key={p.name} onClick={()=>start(p)} className="hover-lift" style={{ background:pat?.name===p.name?C.sageDeep:C.glass, border:`1px solid ${pat?.name===p.name?C.borderActive:C.glassBorder}`, borderRadius:16, padding:"16px 20px", cursor:"pointer", textAlign:"left" }}>
                <p style={{ color:C.charcoal, fontSize:14, fontWeight:500, marginBottom:4 }}>{p.name}</p>
                <p style={{ color:C.muted, fontSize:12 }}>{p.desc} · {p.i}-{p.h?p.h+"-":""}{p.e}</p>
              </button>
            ))}
          </div>

          <div style={{ borderTop:`1px solid ${C.glassBorder}`, paddingTop:24 }}>
            <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:22, color:C.charcoal, fontWeight:300, marginBottom:6 }}>Guided Meditations</p>
            <p style={{ color:C.mid, fontSize:13, lineHeight:1.75, marginBottom:20 }}>Professional recordings by Serena &amp; Charlotte — press play and let go.</p>
            <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
              {GUIDED_VOICES.map(voice => {
                const isActive = activeVoice?.id===voice.id;
                const isPlaying = isActive && playing && !paused;
                const isPaused = isActive && paused;
                return (
                  <div key={voice.id} style={{ background:isActive?`${voice.color}09`:C.glass, border:`1px solid ${isActive?voice.color+"40":C.glassBorder}`, borderRadius:20, padding:18, transition:"all 0.3s ease" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:14, marginBottom:isActive?14:0 }}>
                      <div style={{ width:44, height:44, borderRadius:"50%", background:voice.gradient, display:"flex", alignItems:"center", justifyContent:"center", boxShadow:`0 4px 16px ${voice.glow}`, flexShrink:0 }}>
                        <span style={{ color:C.bg, fontSize:16, fontWeight:600 }}>{voice.label[0]}</span>
                      </div>
                      <div style={{ flex:1 }}>
                        <p style={{ color:C.charcoal, fontSize:14, fontWeight:600 }}>{voice.label}</p>
                        <p style={{ color:voice.color, fontSize:11, marginTop:2 }}>{voice.subtitle}</p>
                      </div>
                      {isPlaying && (
                        <div style={{ display:"flex", gap:3, alignItems:"flex-end", marginRight:8 }}>
                          {[0,1,2,3].map(i=><div key={i} style={{ width:3, borderRadius:2, background:voice.color, animation:`dotBounce 1s ease-in-out ${i*0.15}s infinite`, height:14 }} />)}

                        style={{ width:44, height:44, borderRadius:"50%", background:isPlaying?voice.color:voice.gradient, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:`0 4px 20px ${voice.glow}`, fontSize:16, transition:"all 0.25s ease", flexShrink:0 }}>
                        <span style={{ color:C.bg }}>{isPlaying?"⏸":isPaused?"▶":"▶"}</span>
                      </button>
                    </div>
                    {isActive && (
                      <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:2 }}>
                          <span style={{ color:C.mid, fontSize:12 }}>Speed</span>
                          <span style={{ color:C.charcoal, fontSize:12, fontWeight:500 }}>{playbackRate<=0.75?"Very slow":playbackRate<=0.88?"Gentle":playbackRate<=1.0?"Normal":"Brisk"}</span>
                        </div>
                        <input type="range" min="0.65" max="1.1" step="0.05" value={playbackRate}
                          onChange={e=>{ const r=+e.target.value; setPlaybackRate(r); if(audioRef.current) audioRef.current.playbackRate=r; }}
                          style={{ width:"100%", accentColor:voice.color, marginBottom:4 }} />
                        <button onClick={stopAudio} style={{ background:"none", border:`1px solid ${C.glassBorder}`, borderRadius:12, padding:"9px", color:C.muted, cursor:"pointer", fontSize:12 }}>■ Stop</button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ─── Sounds Tab ───────────────────────────────────────────────────────────
    const SOUNDS = [
      { name:"Pink Noise",   icon:"🌸", type:"pink",     desc:"Classic sleep noise · warm & balanced" },
      { name:"Brown Noise",  icon:"🌫️", type:"brown",    desc:"Deep low rumble · very soothing" },
      { name:"White Noise",  icon:"☁️", type:"white",    desc:"Full spectrum · masks all sounds" },
      { name:"Gentle Rain",  icon:"🌧️", type:"rain",     desc:"Soft rainfall with natural variation" },
      { name:"Ocean Waves",  icon:"🌊", type:"ocean",    desc:"Rolling waves with slow rhythm" },
      { name:"Tibetan Bowl", icon:"🔔", type:"sine",     freq:432, desc:"432 Hz pure tone · deeply calming" },
      { name:"Delta Waves",  icon:"🧠", type:"binaural", freq:2,   desc:"Deep sleep · headphones required" },
    ];

    function SoundsTab() {
      const [active, setActive] = useState(null);
      const [vol, setVol] = useState(0.35);
      const ctxRef = useRef(null);
      const gainRef = useRef(null);
      const nodesRef = useRef([]);

      const stop = () => {
        nodesRef.current.forEach(n => { try { n.stop(); } catch {} });
        nodesRef.current = [];
        try { ctxRef.current?.close(); } catch {}
        ctxRef.current = null;
        setActive(null);
      };

      const makeNoiseBuffer = (ctx, type) => {
        const sr = ctx.sampleRate;
        const frames = sr * 2;
        const buf = ctx.createBuffer(1, frames, sr);
        const d = buf.getChannelData(0);
        let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,lo=0;
        for (let i=0; i<frames; i++) {
          const w = Math.random()*2-1;
          if (type==="white") { d[i]=w*0.45; }
          else if (type==="brown") { lo=(lo+(0.02*w))/1.02; d[i]=lo*3.5; }
          else { b0=0.99886*b0+w*0.0555179;b1=0.99332*b1+w*0.0750759;b2=0.96900*b2+w*0.1538520;b3=0.86650*b3+w*0.3104856;b4=0.55000*b4+w*0.5329522;b5=-0.7616*b5-w*0.0168980;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;b6=w*0.115926; }
        }
        return buf;
      };

      const play = async (s) => {
        stop();
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        ctxRef.current = ctx;
        await ctx.resume();
        const gain = ctx.createGain(); gain.gain.value=vol; gainRef.current=gain;
        gain.connect(ctx.destination);

        if (["white","pink","brown"].includes(s.type)) {
          const src = ctx.createBufferSource();
          src.buffer = makeNoiseBuffer(ctx, s.type);
          src.loop = true;
          if (s.type==="brown") {
            const lpf = ctx.createBiquadFilter();
            lpf.type="lowpass"; lpf.frequency.value=400; lpf.Q.value=0.5;
            src.connect(lpf); lpf.connect(gain);
          } else if (s.type==="pink") {
            const lpf = ctx.createBiquadFilter();
            lpf.type="lowpass"; lpf.frequency.value=8000;
            src.connect(lpf); lpf.connect(gain);
          } else {
            src.connect(gain);
          }
          src.start();
          nodesRef.current = [src];
        } else if (s.type==="rain") {
          const src = ctx.createBufferSource();
          src.buffer = makeNoiseBuffer(ctx, "pink");
          src.loop = true;
          const hpf = ctx.createBiquadFilter();
          hpf.type="highpass"; hpf.frequency.value=1200;
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.value=0.3; lfo.type="sine";
          lfoGain.gain.value=0.12;
          lfo.connect(lfoGain); lfoGain.connect(gain.gain);
          src.connect(hpf); hpf.connect(gain);
          src.start(); lfo.start();
          nodesRef.current = [src, lfo];
        } else if (s.type==="ocean") {
          const src = ctx.createBufferSource();
          src.buffer = makeNoiseBuffer(ctx, "brown");
          src.loop = true;
          const lpf = ctx.createBiquadFilter();
          lpf.type="lowpass"; lpf.frequency.value=600;
          const lfo = ctx.createOscillator();
          const lfoGain = ctx.createGain();
          lfo.frequency.value=0.08; lfo.type="sine";
          lfoGain.gain.value=0.28;
          lfo.connect(lfoGain); lfoGain.connect(gain.gain);
          src.connect(lpf); lpf.connect(gain);
          src.start(); lfo.start();
          nodesRef.current = [src, lfo];
        } else if (s.type==="sine") {
          const o=ctx.createOscillator(); o.frequency.value=s.freq; o.type="sine"; o.connect(gain); o.start();
          nodesRef.current = [o];
        } else if (s.type==="binaural") {
          const merger=ctx.createChannelMerger(2);
          merger.connect(gain);
          const o1=ctx.createOscillator(), o2=ctx.createOscillator();
          const g1=ctx.createGain(), g2=ctx.createGain();
          o1.frequency.value=100; o2.frequency.value=100+s.freq;
          o1.connect(g1); g1.connect(merger,0,0);
          o2.connect(g2); g2.connect(merger,0,1);
          o1.start(); o2.start();
          nodesRef.current = [o1,o2];
        }
        setActive(s.name);
      };

      const changeVol=v=>{setVol(v);if(gainRef.current)gainRef.current.gain.value=v;};
      useEffect(()=>()=>stop(),[]);

      return (
        <div style={{ animation:"fadeUp 0.4s ease" }}>
          <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:30, fontWeight:300, color:C.charcoal, marginBottom:8, letterSpacing:-0.3 }}>Sleep Sounds</p>
          <p style={{ color:C.mid, fontSize:13, lineHeight:1.8, marginBottom:24 }}>Mask noise and cue your nervous system that it's safe to rest.</p>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, marginBottom:20 }}>
            {SOUNDS.map(s => (
              <button key={s.name} onClick={()=>active===s.name?stop():play(s)} className="hover-lift" style={{ background:active===s.name?C.sageDeep:C.glass, border:`1px solid ${active===s.name?C.borderActive:C.glassBorder}`, borderRadius:18, padding:"20px 14px", cursor:"pointer", textAlign:"center" }}>
                <div style={{ fontSize:28, marginBottom:10 }}>{s.icon}</div>
                <p style={{ color:active===s.name?C.sage:C.charcoal, fontSize:13, fontWeight:500, marginBottom:4 }}>{s.name}</p>
                <p style={{ color:active===s.name?C.sageDark:C.muted, fontSize:11 }}>{active===s.name?"▶ Playing":s.desc}</p>
              </button>
            ))}
          </div>
          <Card>
            <div style={{ display:"flex", justifyContent:"space-between", marginBottom:14 }}>
              <span style={{ color:C.mid, fontSize:13 }}>Volume</span>
              <span style={{ color:C.charcoal, fontSize:13, fontWeight:500 }}>{Math.round(vol*100)}%</span>
            </div>
            <input type="range" min="0" max="1" step="0.01" value={vol} onChange={e=>changeVol(+e.target.value)} style={{ width:"100%", accentColor:C.sage }} />
          </Card>
          <p style={{ color:C.muted, fontSize:12, marginTop:16, lineHeight:1.7 }}>💡 Use headphones for binaural delta waves. Delta frequencies (0.5–4 Hz) are associated with deep, restorative sleep stages.</p>
        </div>
      );
    }

    // ─── Coach Tab ────────────────────────────────────────────────────────────

          <p style={{ color:C.mid, fontSize:13, lineHeight:1.8, marginBottom:20 }}>AI-powered CBT-I guidance, personalised to you.</p>

                  <p style={{ color:C.charcoal, fontSize:14, lineHeight:1.8 }}>{m.text}</p>
                </div>
              </div>
            ))}
            {loading && (
              <div style={{ display:"flex", gap:6, padding:"14px 18px", background:C.glass, border:`1px solid ${C.glassBorder}`, borderRadius:"20px 20px 20px 5px", width:"fit-content" }}>
                {[0,1,2].map(i=><div key={i} style={{ width:7, height:7, borderRadius:"50%", background:C.sage, animation:`dotBounce 1.2s ease-in-out ${i*0.2}s infinite` }} />)}

            <div ref={bottomRef} />

            <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()} placeholder="Ask about sleep, anxiety, habits…"
              style={{ flex:1, background:C.glass, border:`1px solid ${C.glassBorder}`, borderRadius:16, padding:"14px 18px", color:C.charcoal, fontSize:14, transition:"border-color 0.2s" }}
              onFocus={e=>e.target.style.borderColor=C.glassBorderHi}
              onBlur={e=>e.target.style.borderColor=C.glassBorder} />
            <button onClick={send} disabled={!input.trim()||loading} style={{ background:`linear-gradient(140deg, ${C.sage}, ${C.sageDark})`, border:"none", borderRadius:16, padding:"14px 20px", color:C.bg, cursor:"pointer", fontSize:18, opacity:!input.trim()?0.4:1, boxShadow:`0 4px 16px ${C.sageGlow}`, transition:"opacity 0.2s" }}>↑</button>

    // ─── Onboarding Questions (distinct from the 10-question assessment) ────────
    const OQ = [
      { id:"hope",    q:"What matters most to you about sleeping better?",
        opts:["More energy to do the things I love","Better mood and less anxiety","Stop dreading bedtime","Finally feeling like myself again"] },
      { id:"waketime",q:"What time do you usually need to wake up?",

    function OnboardingModal({ onComplete, onSkip }) {
      const [step, setStep] = useState(0);

    // ─── Day Complete Modal ───────────────────────────────────────────────────
    function DayCompleteModal({ day, week, nextLabel, onNext, onClose, setTab }) {
      const [mood, setMood] = useState(null);

    function JourneyTab({ setTab, profile }) {
      const savedWeek = parseInt(localStorage.getItem("restora_journey_week") || "1");
      const savedCompleted = JSON.parse(localStorage.getItem("restora_journey_completed") || "[]");
      const TOTAL_DAYS = 42;

      const [currentWeek, setCurrentWeek] = useState(savedWeek);
      const [completed, setCompleted] = useState(new Set(savedCompleted));
      const [expandedDay, setExpandedDay] = useState(null);
      const [completionModal, setCompletionModal] = useState(null); // {day, week}
      const [weekComplete, setWeekComplete] = useState(false);

      const week = JOURNEY_WEEKS[currentWeek - 1];
      const totalCompleted = completed.size;
      const weekKeys = week.days.map(d => `${currentWeek}-${d.day}`);
      const weekCompleted = weekKeys.filter(k => completed.has(k)).length;

      const markComplete = (d) => {
        const key = `${currentWeek}-${d.day}`;
        if (completed.has(key)) {
          // Unmark
          const next = new Set(completed); next.delete(key); setCompleted(next);
          localStorage.setItem("restora_journey_completed", JSON.stringify([...next]));
        } else {
          // Mark complete → show guided modal
          const next = new Set(completed); next.add(key); setCompleted(next);
          localStorage.setItem("restora_journey_completed", JSON.stringify([...next]));
          setCompletionModal({ day: d, week });
          // Check if week is now done
          const newKeys = week.days.map(dd => `${currentWeek}-${dd.day}`);
          const newDone = newKeys.filter(k => next.has(k)).length;
          if (newDone === 7) setWeekComplete(true);
        }
      };

      const handleModalNext = () => {
        const d = completionModal.day;
        setCompletionModal(null);
        if (weekComplete && d.day === 7) {
          // Stay to show week complete banner
        } else {
          // Auto-advance to next day
          const nextDay = d.day < 7 ? `${currentWeek}-${d.day + 1}` : null;
          if (nextDay) setExpandedDay(nextDay);
        }
      };

      const advanceWeek = () => {
        if (currentWeek < 6) {
          const next = currentWeek + 1;
          setCurrentWeek(next); setExpandedDay(`${next}-1`); setWeekComplete(false);
          localStorage.setItem("restora_journey_week", String(next));
        }
      };

      const setWeek = (w) => {
        setCurrentWeek(w); setExpandedDay(null); setWeekComplete(false);
        localStorage.setItem("restora_journey_week", String(w));
      };

      const getJourneyNote = () => {
        if (!profile) return null;
        const { hope, impact, when } = profile;
        if (when && when.includes("1–4am")) return { color:C.rose, text:"Middle-of-night waking is very common. Week 4's cognitive work will be the most transformative for your pattern." };
        if (impact && impact.includes("mood")) return { color:C.sage, text:"Your mood will shift noticeably as your sleep improves — often by the end of Week 2." };
        if (hope && hope.includes("dreading bedtime")) return { color:C.gold, text:"Dreading bedtime is sleep anxiety — and CBT-I was designed exactly for this. You are in the right place." };
        return { color:C.sage, text:"Follow each week in order. Consistency matters more than perfection — even partial effort compounds into real change." };
      };

      const note = getJourneyNote();

      // Find the first incomplete day to highlight as "up next"
      const nextIncompleteKey = weekKeys.find(k => !completed.has(k));

      return (
        <div style={{ animation:"fadeUp 0.45s ease" }}>
          {/* Completion modal */}
          {completionModal && (
            <DayCompleteModal
              day={completionModal.day}
              week={completionModal.week}
              nextLabel={completionModal.day.day < 7 ? `Continue to Day ${completionModal.day.day + 1}` : weekComplete && currentWeek < 6 ? `Start Week ${currentWeek + 1}` : "Close"}
              onNext={handleModalNext}
              onClose={()=>setCompletionModal(null)}
              setTab={setTab}
            />
          )}

          {/* Header */}
          <div style={{ marginBottom:20 }}>
            <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:32, fontWeight:300, color:C.charcoal, letterSpacing:-0.5, marginBottom:4 }}>Your 6-Week Journey</p>
            <p style={{ color:C.mid, fontSize:13, lineHeight:1.8 }}>Gold-standard CBT-I, guided day by day. Designed for women. Follow each step — the path is laid out for you.</p>
          </div>

          {/* Personalised note */}
          {note && (
            <div style={{ background:`${note.color}0D`, border:`1px solid ${note.color}30`, borderRadius:16, padding:"13px 16px", marginBottom:16, display:"flex", gap:12, alignItems:"flex-start" }}>
              <span style={{ color:note.color, fontSize:15, marginTop:1, flexShrink:0 }}>✦</span>
              <p style={{ color:C.charcoal, fontSize:13, lineHeight:1.75 }}>{note.text}</p>
            </div>
          )}

          {/* Week selector — scrollable */}
          <div style={{ display:"flex", gap:8, marginBottom:20, overflowX:"auto", paddingBottom:4 }}>
            {JOURNEY_WEEKS.map(w => {
              const wKeys = w.days.map(d => `${w.week}-${d.day}`);
              const wDone = wKeys.filter(k => completed.has(k)).length;
              const isActive = w.week === currentWeek;
              const isAllDone = wDone === 7;
              return (
                <button key={w.week} onClick={()=>setWeek(w.week)}
                  style={{ minWidth:82, padding:"11px 8px", background:isActive?`${w.color}18`:isAllDone?`${w.color}0A`:C.glass, border:`1.5px solid ${isActive?w.color+"70":isAllDone?w.color+"40":C.glassBorder}`, borderRadius:14, cursor:"pointer", textAlign:"center", transition:"all 0.22s ease", flexShrink:0, position:"relative" }}>
                  {isAllDone && <span style={{ position:"absolute", top:-6, right:-4, background:w.grad, borderRadius:"50%", width:16, height:16, fontSize:9, display:"flex", alignItems:"center", justifyContent:"center", color:"#0F0D0B", fontWeight:700 }}>✓</span>}
                  <p style={{ color:isActive?w.color:C.muted, fontSize:9, fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:3 }}>Week {w.week}</p>
                  <p style={{ color:isActive?C.charcoal:C.muted, fontSize:11, fontWeight:500, marginBottom:5, lineHeight:1.3 }}>{w.title}</p>
                  <div style={{ height:2, background:C.glassBorder, borderRadius:1, overflow:"hidden" }}>
                    <div style={{ height:"100%", width:`${(wDone/7)*100}%`, background:w.grad, borderRadius:1, transition:"width 0.3s ease" }} />
                  </div>
                  <p style={{ color:C.muted, fontSize:9, marginTop:3 }}>{wDone}/7</p>
                </button>
              );
            })}
          </div>

          {/* Week complete banner */}
          {weekComplete && weekCompleted === 7 && (
            <div style={{ background:`${week.color}15`, border:`1.5px solid ${week.color}55`, borderRadius:18, padding:"18px 18px", marginBottom:16, textAlign:"center", animation:"fadeUp 0.4s ease" }}>
              <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:22, color:C.charcoal, marginBottom:6 }}>✦ Week {week.week} complete</p>
              <p style={{ color:C.mid, fontSize:13, lineHeight:1.75, marginBottom:14 }}>You've finished {week.title}. Take a moment — then carry this into next week.</p>
              {currentWeek < 6 && (
                <button onClick={advanceWeek} style={{ background:week.grad, border:"none", borderRadius:14, padding:"12px 26px", color:"#0F0D0B", fontSize:14, fontWeight:600, cursor:"pointer", boxShadow:`0 4px 20px ${week.color}45` }}>
                  Begin Week {currentWeek + 1}: {JOURNEY_WEEKS[currentWeek].title} ›
                </button>
              )}
            </div>
          )}

          {/* Week overview card */}
          <div style={{ background:`${week.color}0C`, border:`1.5px solid ${week.color}30`, borderRadius:20, padding:"18px 16px", marginBottom:16 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10 }}>
              <div>
                <p style={{ background:week.grad, WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", fontSize:10, fontWeight:700, letterSpacing:2.5, textTransform:"uppercase", marginBottom:3 }}>Week {week.week} of 6</p>
                <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:24, color:C.charcoal, fontWeight:400, letterSpacing:-0.3 }}>{week.title}</p>
                <p style={{ color:C.muted, fontSize:12, fontStyle:"italic", marginTop:1 }}>{week.subtitle}</p>
              </div>
              <div style={{ textAlign:"right" }}>
                <p style={{ color:week.color, fontSize:20, fontWeight:300, fontFamily:"Cormorant Garamond, serif", lineHeight:1 }}>{weekCompleted}<span style={{ fontSize:12, color:C.muted }}>/7</span></p>
                <p style={{ color:C.muted, fontSize:10, marginTop:2 }}>days done</p>
              </div>
            </div>
            <p style={{ color:C.mid, fontSize:13, lineHeight:1.8, marginBottom:10 }}>{week.intro}</p>
            <div style={{ background:`${week.color}10`, borderRadius:11, padding:"9px 13px" }}>
              <p style={{ color:week.color, fontSize:10, fontWeight:600, letterSpacing:1.5, textTransform:"uppercase", marginBottom:3 }}>This week's focus</p>
              <p style={{ color:C.charcoal, fontSize:13, lineHeight:1.7 }}>{week.theme}</p>
            </div>
          </div>

          {/* Day cards */}
          <p style={{ color:C.muted, fontSize:10, fontWeight:700, letterSpacing:2.2, textTransform:"uppercase", marginBottom:10 }}>Daily Practice</p>
          <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
            {week.days.map((d, idx) => {
              const key = `${currentWeek}-${d.day}`;
              const done = completed.has(key);
              const open = expandedDay === key;
              const isNext = key === nextIncompleteKey && !done;

              return (
                <div key={key} style={{ background:done?`${week.color}0A`:isNext?`${week.color}06`:C.glass, border:`1px solid ${done?week.color+"45":isNext?week.color+"30":C.glassBorder}`, borderRadius:17, overflow:"hidden", transition:"all 0.22s ease" }}>
                  <button onClick={()=>setExpandedDay(open ? null : key)}
                    style={{ display:"flex", gap:13, alignItems:"center", width:"100%", background:"none", border:"none", padding:"14px 15px", cursor:"pointer", textAlign:"left" }}>
                    <div style={{ minWidth:33, height:33, borderRadius:10, background:done?week.grad:isNext?`${week.color}20`:`${week.color}12`, border:`1px solid ${week.color}${done?"":isNext?"55":"30"}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                      {done
                        ? <span style={{ color:"#0F0D0B", fontSize:13, fontWeight:700 }}>✓</span>
                        : <span style={{ color:week.color, fontSize:12 }}>{d.icon}</span>
                      }
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:2 }}>
                        <p style={{ color:C.muted, fontSize:9, fontWeight:700, letterSpacing:1.8, textTransform:"uppercase" }}>Day {d.day}</p>
                        {isNext && <span style={{ background:week.grad, borderRadius:8, padding:"1px 8px", fontSize:9, fontWeight:700, color:"#0F0D0B", letterSpacing:0.5 }}>Up next</span>}
                        {done && <span style={{ color:C.muted, fontSize:9 }}>Done</span>}
                      </div>
                      <p style={{ color:done?C.muted:C.charcoal, fontSize:14, fontWeight:500, lineHeight:1.4, textDecoration:done?"line-through":"none", textDecorationColor:`${C.muted}80` }}>{d.title}</p>
                    </div>
                    <span style={{ color:C.muted, fontSize:15, transform:open?"rotate(90deg)":"rotate(0deg)", transition:"transform 0.2s ease", flexShrink:0 }}>›</span>
                  </button>

                  {open && (
                    <div style={{ padding:"0 15px 16px", animation:"fadeUp 0.2s ease" }}>
                      <p style={{ color:C.mid, fontSize:14, lineHeight:1.85, marginBottom:13 }}>{d.desc}</p>
                      <div style={{ background:`${week.color}09`, border:`1px solid ${week.color}1A`, borderRadius:11, padding:"11px 13px", marginBottom:13 }}>
                        <p style={{ color:week.color, fontSize:9, fontWeight:700, letterSpacing:1.8, textTransform:"uppercase", marginBottom:5 }}>Why this works</p>
                        <p style={{ color:C.charcoal, fontSize:13, lineHeight:1.8 }}>{d.why}</p>
                      </div>
                      <div style={{ display:"flex", gap:9, flexWrap:"wrap" }}>
                        {d.tab && (
                          <button onClick={()=>setTab(d.tab)} style={{ background:week.grad, border:"none", borderRadius:11, padding:"10px 16px", color:"#0F0D0B", fontSize:13, fontWeight:600, cursor:"pointer", boxShadow:`0 3px 14px ${week.color}38` }}>
                            {d.tabLabel} ›
                          </button>
                        )}
                        {!done ? (
                          <button onClick={()=>markComplete(d)} style={{ background:C.glass, border:`1px solid ${week.color}55`, borderRadius:11, padding:"10px 16px", color:week.color, fontSize:13, fontWeight:500, cursor:"pointer" }}>
                            Mark complete ✓
                          </button>
                        ) : (
                          <button onClick={()=>markComplete(d)} style={{ background:"none", border:`1px solid ${C.glassBorder}`, borderRadius:11, padding:"10px 16px", color:C.muted, fontSize:12, cursor:"pointer" }}>
                            Undo
                          </button>
                        )}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Overall progress */}
          <div style={{ marginTop:22, borderTop:`1px solid ${C.glassBorder}`, paddingTop:18 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
              <p style={{ color:C.muted, fontSize:11, fontWeight:500 }}>Overall programme</p>
              <p style={{ color:C.charcoal, fontSize:13, fontWeight:600 }}>{totalCompleted} <span style={{ color:C.muted, fontWeight:400 }}>/ {TOTAL_DAYS} days</span></p>
            </div>
            <div style={{ height:5, background:C.glassBorder, borderRadius:3, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${(totalCompleted/TOTAL_DAYS)*100}%`, background:`linear-gradient(90deg, ${C.sage}, ${C.gold}, ${C.rose}, #B8A0D8, #7EC8E3, #D4956A)`, borderRadius:3, transition:"width 0.5s ease" }} />
            </div>
            {totalCompleted === TOTAL_DAYS && (
              <p style={{ fontFamily:"Cormorant Garamond, serif", color:C.gold, fontSize:19, marginTop:14, textAlign:"center" }}>✦ Six weeks complete. You have done exceptional work. ✦</p>
            )}
          </div>
        </div>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────
    function App() {
      const [unlocked, setUnlocked] = useState(false);
      const [tab, setTab] = useState("about");
      const [diagnosis, setDiagnosis] = useState(null);
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [dark, setDark] = useState(() => localStorage.getItem("restora_theme") !== "light");
      const [journeyProfile, setJourneyProfile] = useState(() => {
        try { return JSON.parse(localStorage.getItem("restora_journey_profile") || "null"); } catch { return null; }
      });

      const toggleTheme = () => {
        const next = !dark;
        setDark(next);
        localStorage.setItem("restora_theme", next ? "dark" : "light");
      };

      const handleUnlock = () => {
        setUnlocked(true);
        const alreadyOnboarded = localStorage.getItem("restora_onboarded");
        if (!alreadyOnboarded) setShowOnboarding(true);
      };

      const handleOnboardingComplete = (profile) => {
        setJourneyProfile(profile);
        setShowOnboarding(false);
        setTab("journey");
      };

      const handleOnboardingSkip = () => {
        localStorage.setItem("restora_onboarded", "true");
        setShowOnboarding(false);
      };

      if (!unlocked) return (
        <div style={{ filter: dark ? "none" : "invert(1) hue-rotate(180deg)" }}>
          <PasswordGate onUnlock={handleUnlock} />
        </div>
      );

      return (
        <div style={{ minHeight:"100vh", background:C.bg, fontFamily:"Inter, sans-serif", filter: dark ? "none" : "invert(1) hue-rotate(180deg)" }}>
          <style>{GLOBAL_CSS}</style>
          <OrbFilters />
          {showOnboarding && <OnboardingModal onComplete={handleOnboardingComplete} onSkip={handleOnboardingSkip} />}
          <div style={{ background:"rgba(15,13,11,0.85)", borderBottom:`1px solid ${C.glassBorder}`, padding:"14px 20px", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", position:"sticky", top:0, zIndex:100 }}>
            <div style={{ maxWidth:520, margin:"0 auto", display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ width:34, height:34, position:"relative", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <div style={{ position:"absolute", inset:"-6px", borderRadius:"50%", background:C.sageGlow, filter:"blur(8px)", animation:"glowIdle 5s ease-in-out infinite" }} />
                <div style={{ width:34, height:34, borderRadius:"50%", background:`radial-gradient(circle at 33% 28%, rgba(200,245,225,0.5), ${C.sage} 45%, ${C.sageDark})`, boxShadow:`0 0 16px ${C.sageGlow}`, animation:"orbIdle 6s ease-in-out infinite" }} />
              </div>
              <div style={{ flex:1 }}>
                <p style={{ fontFamily:"Cormorant Garamond, serif", fontSize:22, color:C.charcoal, fontWeight:400, letterSpacing:-0.2, lineHeight:1 }}>Restora</p>
                <p style={{ color:C.muted, fontSize:10, letterSpacing:2, textTransform:"uppercase", marginTop:2 }}>by Velaora</p>
              </div>
              {diagnosis && <div style={{ background:C.sageDeep, border:`1px solid ${C.sage}45`, borderRadius:20, padding:"5px 13px" }}><span style={{ color:C.sage, fontSize:11, fontWeight:600 }}>✓ Assessed</span></div>}
              <button onClick={toggleTheme} title={dark ? "Switch to light mode" : "Switch to dark mode"}
                style={{ background:"none", border:`1px solid ${C.glassBorder}`, borderRadius:10, padding:"6px 10px", cursor:"pointer", color:C.muted, fontSize:15, lineHeight:1, marginLeft:4, transition:"border-color 0.2s" }}
                onMouseEnter={e=>e.currentTarget.style.borderColor=C.sage}
                onMouseLeave={e=>e.currentTarget.style.borderColor=C.glassBorder}>
                {dark ? "☀" : "☾"}
              </button>
            </div>
          </div>
          <div style={{ background:"rgba(15,13,11,0.70)", borderBottom:`1px solid ${C.glassBorder}`, overflowX:"auto", backdropFilter:"blur(12px)", WebkitBackdropFilter:"blur(12px)", position:"sticky", top:63, zIndex:99 }}>
            <div style={{ display:"flex", maxWidth:520, margin:"0 auto", minWidth:"max-content" }}>
              {TABS.map(t => (
                <button key={t.id} onClick={()=>setTab(t.id)} style={{ background:"none", border:"none", padding:"13px 16px", cursor:"pointer", color:tab===t.id?C.sage:C.muted, fontWeight:tab===t.id?600:400, fontSize:13, whiteSpace:"nowrap", borderBottom:`2px solid ${tab===t.id?C.sage:"transparent"}`, transition:"color 0.22s ease, border-color 0.22s ease", letterSpacing:0.2 }}>
                  <span style={{ marginRight:5, fontSize:10 }}>{t.icon}</span>{t.label}
                </button>
              ))}
            </div>
          </div>
          <div key={tab} style={{ maxWidth:520, margin:"0 auto", padding:"28px 18px 80px", animation:"tabEnter 0.32s ease" }}>
            {tab==="about"    && <AboutTab setTab={setTab} />}
            {tab==="journey"  && <JourneyTab setTab={setTab} profile={journeyProfile} />}
            {tab==="diagnose" && <DiagnoseTab onDiagnosis={d=>setDiagnosis(d)} setTab={setTab} />}
            {tab==="cbti"     && <CBTITab />}
            {tab==="meditate" && <MeditateTab />}
            {tab==="sounds"   && <SoundsTab />}
            {tab==="coach"    && <CoachTab diagnosis={diagnosis} />}
          </div>
          <div style={{ borderTop:`1px solid ${C.glassBorder}`, padding:"20px 18px", textAlign:"center", background:"rgba(9,8,7,0.8)" }}>
            <p style={{ color:C.muted, fontSize:11 }}>© 2025 Velaora · Restora Sleep Programme · <span style={{ fontStyle:"italic" }}>For women who deserve better rest</span></p>
            <p style={{ color:C.muted, fontSize:10, marginTop:6, opacity:0.6 }}>
              <a href="/privacy" style={{ color:C.muted, textDecoration:"none" }} onMouseEnter={e=>e.target.style.color=C.sage} onMouseLeave={e=>e.target.style.color=C.muted}>Privacy Policy</a>
              {" · "}
              <a href="/terms" style={{ color:C.muted, textDecoration:"none" }} onMouseEnter={e=>e.target.style.color=C.sage} onMouseLeave={e=>e.target.style.color=C.muted}>Terms of Service</a>
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
